<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#080E4B" />
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#FFED00" stroke="#080E4B" stroke-width="4" />
  <!-- Robot Antenna -->
  <line x1="32" y1="12" x2="32" y2="18" stroke="#080E4B" stroke-width="4" stroke-linecap="round" />
  <circle cx="32" cy="11" r="4" fill="#E3000B" stroke="#080E4B" stroke-width="2" />
  <!-- Robot Head -->
  <rect x="14" y="18" width="36" height="30" rx="8" fill="#E3000B" stroke="#080E4B" stroke-width="4" />
  <!-- Robot Eyes -->
  <circle cx="24" cy="30" r="5" fill="#FFFFFF" stroke="#080E4B" stroke-width="2" />
  <circle cx="24" cy="30" r="2.5" fill="#080E4B" />
  <circle cx="40" cy="30" r="5" fill="#FFFFFF" stroke="#080E4B" stroke-width="2" />
  <circle cx="40" cy="30" r="2.5" fill="#080E4B" />
  <!-- Robot Mouth/Meters -->
  <rect x="22" y="39" width="20" height="5" rx="2" fill="#FFED00" stroke="#080E4B" stroke-width="2" />
  <!-- Robot Ears -->
  <rect x="8" y="27" width="6" height="12" rx="3" fill="#080E4B" />
  <rect x="50" y="27" width="6" height="12" rx="3" fill="#080E4B" />
</svg>